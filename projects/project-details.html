<!DOCTYPE html>
<html lang="en">
<!--  -->

<head>
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "xiysrgo3r1");
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Civil Engineering Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/project-details.css">
    <link rel="stylesheet" type="text/css" href="../css/common.css">
    <link rel="icon" type="image/jpeg" href="../imgs/logo/NewLogo.jpeg">

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

</head>

<body>
    <!-- Unified Site Header -->
    <header class="site-header is-scrolled" id="siteHeader">
        <div class="header-progress" id="headerProgress"></div>
        <div class="header-inner">
            <a href="../index.html" class="brand" aria-label="Heim - Home">
                <div class="brand-emblem-wrap">
                    <img src="../imgs/logo/NewLogo.jpeg" alt="Heim Emblem" class="brand-logo">
                </div>
                <div class="brand-text">
                    <span class="brand-name">HEIM</span>
                    <span class="brand-tagline">Architecture &amp; Interiors</span>
                </div>
            </a>

            <nav class="main-nav" id="mainNav">
                <a href="../index.html#about" class="nav-link">About</a>
                <a href="../index.html#proof" class="nav-link">Proof</a>
                <a href="../index.html#process" class="nav-link">Process</a>
                <a href="index.html" class="nav-link">Projects</a>
                <a href="../index.html#contact" class="nav-link">Contact</a>
            </nav>

            <a href="https://wa.me/+201116030118" target="_blank" rel="noopener" class="header-cta">Book a
                consultation</a>

            <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>
    <!-- Project Hero -->
    <section class="project-hero">
        <div class="container">
            <div class="row">
                <div class="col-lg-8">
                    <div class="hero-content">
                        <h1 class="project-title" id="dynamic-project-title">Loading Project...</h1>
                        <div class="project-meta">
                            <div class="meta-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <span id="dynamic-location"></span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-calendar-alt"></i>
                                <span id="dynamic-dates"></span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-building"></i>
                                <span id="dynamic-category"></span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-ruler-combined"></i>
                                <span id="dynamic-size"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Project Content -->
    <section class="project-content" id="project-Overview">
        <div class="container">


            <!-- Before/After Slider -->
            <div class="row mb-5">
                <div class="row mb-5" id="before-after-section">
                    <div class="col-lg-10 mx-auto">
                        <h2 class="section-title">Site Overview</h2>
                        <div class="slider-container" id="mainSlider">
                            <div class="before-image">
                                <img id="before-image" src="" alt="Before Construction">
                                <div class="before-text">Before</div>
                            </div>
                            <div class="after-image">
                                <img id="after-image" src="" alt="After Construction">
                                <div class="after-text">After</div>
                            </div>
                            <div class="slider-handle"></div>
                            <div class="slider-line">
                                <div class="pulse-container">
                                    <svg role="presentation" focusable="false" fill="none" width="50" height="50"
                                        viewBox="0 0 50 50">
                                        <g>
                                            <rect width="50" height="50" rx="25" fill="#ffffff"></rect>
                                            <path d="m19.25 19-6 6 6 6m11.5 0 6-6-6-6" stroke="#000000"
                                                stroke-width=".75" stroke-linecap="square"></path>
                                        </g>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Project Gallery -->
            <div class="gallery-container">
                <div class="row">
                    <div class="col-lg-10 mx-auto">
                        <h2 class="section-title">Project Gallery</h2>
                        <div class="gallery-tabs mb-4" id="gallery-tabs"></div>

                        <div class="gallery-grid" id="dynamic-gallery">
                            <!-- Gallery items will be inserted here by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
            <!-- Fullscreen Image Viewer -->
            <div id="fullscreenViewer" class="fullscreen-viewer">
                <span class="close-viewer">&times;</span>

                <img id="viewerImage" class="viewer-image" src="">

                <div class="viewer-arrow left-arrow">&#10094;</div>
                <div class="viewer-arrow right-arrow">&#10095;</div>
            </div>


        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <a href="../index.html">
                <img src="../imgs/logo/NewLogo.jpeg" alt="Heim Logo" class="footer-logo"
                    style="height:44px;width:44px;border-radius:50%;object-fit:cover;">
            </a>
            <ul class="footer-links">
                <li><a href="../index.html#home">Home</a></li>
                <li><a href="../index.html#about">About</a></li>
                <li><a href="index.html">Projects</a></li>
                <li><a href="../index.html#Experience">Experience</a></li>
                <li><a href="../index.html#contact">Contact</a></li>
            </ul>
            <div class="copyright">
                <p>&copy; 2025 Heim. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" alt="" class="modal-img">
                    <h5 id="modalCaption" class="mt-3"></h5>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/project-details-content.js" defer></script>
    <script src="js/project-details.js" defer></script>
    <script src="../js/common.js" defer></script>
</body>

</html>
